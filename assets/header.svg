<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Izhar Malik, Team Lead Android Development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a17"/><stop offset="1" stop-color="#0f1a3f"/>
    </linearGradient>
    <linearGradient id="name" x1="0" x2="1">
      <stop offset="0" stop-color="#3DDC84"/><stop offset="1" stop-color="#4C8DF6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/>
    </pattern>
    <radialGradient id="glowG"><stop offset="0" stop-color="#3DDC84" stop-opacity=".28"/><stop offset="1" stop-color="#3DDC84" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB"><stop offset="0" stop-color="#4C8DF6" stop-opacity=".35"/><stop offset="1" stop-color="#4C8DF6" stop-opacity="0"/></radialGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',SFMono-Regular,Consolas,'Liberation Mono',monospace}
    .sans{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
    .l{opacity:1;animation:in .35s ease-out both}
    .l1{animation-delay:.3s}.l2{animation-delay:.7s}.l3{animation-delay:1.1s}
    .l4{animation-delay:1.5s}.l5{animation-delay:1.9s}.l6{animation-delay:2.3s}.l7{animation-delay:2.7s}
    @keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
    .g1{animation:drift 14s ease-in-out infinite alternate}
    .g2{animation:drift 18s ease-in-out infinite alternate-reverse}
    @keyframes drift{from{transform:translate(0,0)}to{transform:translate(40px,-24px)}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle class="g1" cx="160" cy="40" r="260" fill="url(#glowG)"/>
    <circle class="g2" cx="1040" cy="300" r="300" fill="url(#glowB)"/>

    <!-- android head -->
    <g transform="translate(60,48)">
      <path d="M0 30A30 30 0 0 1 60 30Z" fill="#3DDC84"/>
      <path d="M12 6L5 -4M48 6L55 -4" stroke="#3DDC84" stroke-width="3" stroke-linecap="round"/>
      <circle cx="20" cy="19" r="3.2" fill="#060a17"/><circle cx="40" cy="19" r="3.2" fill="#060a17"/>
    </g>
    <text x="140" y="84" class="sans" font-size="18" fill="#3DDC84" font-weight="600" letter-spacing="1">Hi, I'm</text>

    <text x="58" y="172" class="sans" font-size="72" font-weight="800" fill="url(#name)" letter-spacing="-1">Izhar Malik</text>
    <text x="60" y="214" class="sans" font-size="23" fill="#c9d1d9">Team Lead, Android Development at Technest.pk</text>

    <g class="sans" font-size="15" font-weight="600" text-anchor="middle">
      <rect x="60"  y="242" width="92"  height="34" rx="17" fill="#7F52FF" fill-opacity=".18" stroke="#7F52FF"/><text x="106" y="264" fill="#c4b0ff">Kotlin</text>
      <rect x="164" y="242" width="80"  height="34" rx="17" fill="#F89820" fill-opacity=".16" stroke="#F89820"/><text x="204" y="264" fill="#ffc46b">Java</text>
      <rect x="256" y="242" width="170" height="34" rx="17" fill="#4C8DF6" fill-opacity=".18" stroke="#4C8DF6"/><text x="341" y="264" fill="#a9c8ff">Jetpack Compose</text>
    </g>

    <!-- code window -->
    <rect x="690" y="42" width="450" height="236" rx="14" fill="#0b1220" stroke="#2a3550"/>
    <path d="M690 56a14 14 0 0 1 14-14h422a14 14 0 0 1 14 14v22H690z" fill="#141d33"/>
    <circle cx="712" cy="60" r="5.5" fill="#ff5f57"/><circle cx="732" cy="60" r="5.5" fill="#febc2e"/><circle cx="752" cy="60" r="5.5" fill="#28c840"/>
    <text x="915" y="65" class="mono" font-size="12" fill="#6b7a99" text-anchor="middle">Profile.kt</text>

    <g class="mono" font-size="15">
      <text class="l l1" x="716" y="108" fill="#e5c07b">@Composable</text>
      <text class="l l2" x="716" y="132"><tspan fill="#c678dd">fun </tspan><tspan fill="#61afef">IzharMalik</tspan><tspan fill="#abb2bf">() = Developer(</tspan></text>
      <text class="l l3" x="740" y="156"><tspan fill="#abb2bf">role = </tspan><tspan fill="#98c379">"Team Lead, Android"</tspan><tspan fill="#abb2bf">,</tspan></text>
      <text class="l l4" x="740" y="180"><tspan fill="#abb2bf">stack = listOf(</tspan><tspan fill="#98c379">"Kotlin"</tspan><tspan fill="#abb2bf">, </tspan><tspan fill="#98c379">"Compose"</tspan><tspan fill="#abb2bf">),</tspan></text>
      <text class="l l5" x="740" y="204"><tspan fill="#abb2bf">builds = </tspan><tspan fill="#98c379">"scalable apps"</tspan><tspan fill="#abb2bf">,</tspan></text>
      <text class="l l6" x="740" y="228"><tspan fill="#abb2bf">learning = </tspan><tspan fill="#d19a66">always</tspan></text>
      <text class="l l7" x="716" y="252"><tspan fill="#abb2bf">)</tspan></text>
      <rect class="cur" x="732" y="239" width="9" height="16" fill="#3DDC84"/>
    </g>
  </g>
</svg>

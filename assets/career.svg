<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="256" viewBox="0 0 1200 256" role="img" aria-label="Career path: Android Developer at ITZON, Senior Android Developer at The Smart Coders, Team Lead at Technest.pk">
  <defs>
    <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#3a4a72"/><stop offset="1" stop-color="#3DDC84"/></linearGradient>
  </defs>
  <style>
    .s{font-family:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
    .pulse{transform-box:fill-box;transform-origin:center;animation:p 2.2s ease-out infinite}
    @keyframes p{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.6);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <rect width="1200" height="256" rx="18" fill="#0d1117" stroke="#262f45"/>
  <rect x="160" y="62" width="880" height="4" rx="2" fill="url(#line)"/>

  <!-- node 1 -->
  <circle cx="200" cy="64" r="11" fill="#0d1117" stroke="#6b7a99" stroke-width="3"/>
  <g class="s" text-anchor="middle">
    <text x="200" y="112" font-size="22" font-weight="700" fill="#e6edf3">ITZON</text>
    <text x="200" y="140" font-size="16" fill="#9aa7c0">Android Developer</text>
    <text x="200" y="176" font-size="14" fill="#6b7a99">Employee of the Month, Oct 2022</text>
  </g>

  <!-- node 2 -->
  <circle cx="600" cy="64" r="11" fill="#0d1117" stroke="#4C8DF6" stroke-width="3"/>
  <g class="s" text-anchor="middle">
    <text x="600" y="112" font-size="22" font-weight="700" fill="#e6edf3">The Smart Coders</text>
    <text x="600" y="140" font-size="16" fill="#9aa7c0">Senior Android Developer</text>
  </g>

  <!-- node 3 -->
  <circle class="pulse" cx="1000" cy="64" r="11" fill="#3DDC84"/>
  <circle cx="1000" cy="64" r="11" fill="#3DDC84"/>
  <g class="s" text-anchor="middle">
    <text x="1000" y="112" font-size="22" font-weight="700" fill="#e6edf3">Technest.pk</text>
    <text x="1000" y="140" font-size="16" fill="#9aa7c0">Team Lead, Android Development</text>
    <text x="1000" y="172" font-size="14" fill="#6b7a99">Employee of the Month, Aug 2023</text>
    <text x="1000" y="192" font-size="14" fill="#6b7a99">Employee of the Year, 2024</text>
    <rect x="950" y="206" width="100" height="26" rx="13" fill="#3DDC84" fill-opacity=".15" stroke="#3DDC84"/>
    <text x="1000" y="224" font-size="13" font-weight="700" fill="#3DDC84">Current role</text>
  </g>
</svg>

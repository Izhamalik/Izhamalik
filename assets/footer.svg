<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" role="img" aria-label="Let's build something amazing together">
  <defs>
    <linearGradient id="w" x1="0" x2="1"><stop offset="0" stop-color="#3DDC84"/><stop offset=".5" stop-color="#4C8DF6"/><stop offset="1" stop-color="#7F52FF"/></linearGradient>
  </defs>
  <style>
    .a{animation:s 9s ease-in-out infinite alternate}.b{animation:s 13s ease-in-out infinite alternate-reverse}

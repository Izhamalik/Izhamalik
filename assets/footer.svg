    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <g fill="url(#w)">
    <path class="b" opacity=".35" d="M-100 70C100 30 250 110 450 70S800 30 1000 70 1250 90 1300 70V160H-100Z"/>
    <path class="a" opacity=".6" d="M-100 95C100 60 300 125 500 95S850 65 1050 95 1250 110 1300 95V160H-100Z"/>
